<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Dynamic Report</title>
<style>
.box { border: 2px solid #333; padding: 15px; margin-bottom: 20px; }
.row { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
.group { margin-left: 20px; margin-top: 5px; }
select { padding: 5px; margin-right: 5px; }
button { padding: 5px 10px; margin-left: 3px; cursor: pointer; }
</style>
</head>
<body>

<form method="POST" action="save.php">

<h2>Report công việc</h2>

<!-- DONE -->
<div id="done-container" class="box">
<h3>Done</h3>
<div class="row">
    <select name="done[0][main]" class="main">
        <option value="">Main</option>
        <option value="dev">Dev</option>
        <option value="test">Test</option>
    </select>

    <button type="button" onclick="addTask('done')">+</button>
    <button type="button" onclick="removeTask(this)">-</button>

    <div class="work-container">
        <div class="group">
            <select name="done[0][work][0][name]" class="work">
                <option value="">Work</option>
            </select>

            <button type="button" onclick="addWork(this)">+</button>
            <button type="button" onclick="removeWork(this)">-</button>

            <div class="sub-container">
                <div class="group">
                    <select name="done[0][work][0][sub][]">
                        <option value="">Sub</option>
                    </select>

                    <button type="button" onclick="addSub(this)">+</button>
                    <button type="button" onclick="removeSub(this)">-</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<!-- COPY y chang cho 3 cái dưới -->
<div id="todo-container" class="box">
<h3>Todo</h3>
<div class="row">
    <select name="todo[0][main]" class="main">
        <option value="">Main</option>
        <option value="dev">Dev</option>
        <option value="test">Test</option>
    </select>

    <button type="button" onclick="addTask('todo')">+</button>
    <button type="button" onclick="removeTask(this)">-</button>

    <div class="work-container">
        <div class="group">
            <select name="todo[0][work][0][name]" class="work">
                <option value="">Work</option>
            </select>

            <button type="button" onclick="addWork(this)">+</button>
            <button type="button" onclick="removeWork(this)">-</button>

            <div class="sub-container">
                <div class="group">
                    <select name="todo[0][work][0][sub][]">
                        <option value="">Sub</option>
                    </select>

                    <button type="button" onclick="addSub(this)">+</button>
                    <button type="button" onclick="removeSub(this)">-</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<div id="plan-container" class="box">
<h3>Plan</h3>
<div class="row">
    <select name="plan[0][main]" class="main">
        <option value="">Main</option>
        <option value="dev">Dev</option>
        <option value="test">Test</option>
    </select>

    <button type="button" onclick="addTask('plan')">+</button>
    <button type="button" onclick="removeTask(this)">-</button>

    <div class="work-container">
        <div class="group">
            <select name="plan[0][work][0][name]" class="work">
                <option value="">Work</option>
            </select>

            <button type="button" onclick="addWork(this)">+</button>
            <button type="button" onclick="removeWork(this)">-</button>

            <div class="sub-container">
                <div class="group">
                    <select name="plan[0][work][0][sub][]">
                        <option value="">Sub</option>
                    </select>

                    <button type="button" onclick="addSub(this)">+</button>
                    <button type="button" onclick="removeSub(this)">-</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<div id="issue-container" class="box">
<h3>Issue</h3>
<div class="row">
    <select name="issue[0][main]" class="main">
        <option value="">Main</option>
        <option value="dev">Dev</option>
        <option value="test">Test</option>
    </select>

    <button type="button" onclick="addTask('issue')">+</button>
    <button type="button" onclick="removeTask(this)">-</button>

    <div class="work-container">
        <div class="group">
            <select name="issue[0][work][0][name]" class="work">
                <option value="">Work</option>
            </select>

            <button type="button" onclick="addWork(this)">+</button>
            <button type="button" onclick="removeWork(this)">-</button>

            <div class="sub-container">
                <div class="group">
                    <select name="issue[0][work][0][sub][]">
                        <option value="">Sub</option>
                    </select>

                    <button type="button" onclick="addSub(this)">+</button>
                    <button type="button" onclick="removeSub(this)">-</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<button type="submit">Lưu</button>

</form>
<script>
const data = {
    dev: {
        backend: ["API", "Database"],
        frontend: ["UI", "UX"]
    },
    test: {
        auto: ["Unit test"],
        manual: ["Manual test"]
    }
};

// ===== REINDEX =====
function reIndex(type){
    const rows = document.querySelectorAll(`#${type}-container .row`);

    rows.forEach((row,i)=>{
        row.querySelector(".main").name = `${type}[${i}][main]`;

        const works = row.querySelectorAll(".work-container > .group");

        works.forEach((w,j)=>{
            w.querySelector(".work").name = `${type}[${i}][work][${j}][name]`;

            const subs = w.querySelectorAll("select[name*='sub']");
            subs.forEach(s=>{
                s.name = `${type}[${i}][work][${j}][sub][]`;
            });
        });
    });
}

// ===== ADD TASK =====
function addTask(type){
    const container = document.getElementById(type+"-container");
    const row = container.querySelector(".row").cloneNode(true);

    // reset
    row.querySelectorAll("select").forEach(s=>{
        s.value = "";
        if(s.classList.contains("work")){
            s.innerHTML = '<option value="">Work</option>';
        }
        if(s.name.includes("sub")){
            s.innerHTML = '<option value="">Sub</option>';
        }
    });

    container.appendChild(row);
    reIndex(type);
}

// ===== REMOVE TASK =====
function removeTask(btn){
    const box = btn.closest(".box");
    const type = box.id.replace("-container","");

    if(box.querySelectorAll(".row").length > 1){
        btn.closest(".row").remove();
        reIndex(type);
    }
}

// ===== ADD WORK =====
function addWork(btn){
    const row = btn.closest(".row");
    const container = row.querySelector(".work-container");
    const type = row.closest(".box").id.replace("-container","");

    const work = container.querySelector(".group").cloneNode(true);

    work.querySelectorAll("select").forEach(s=>{
        s.value = "";
        if(s.classList.contains("work")){
            s.innerHTML = '<option value="">Work</option>';
        }
        if(s.name.includes("sub")){
            s.innerHTML = '<option value="">Sub</option>';
        }
    });

    container.appendChild(work);
    reIndex(type);
}

// ===== REMOVE WORK =====
function removeWork(btn){
    const row = btn.closest(".row");
    const type = row.closest(".box").id.replace("-container","");
    const container = btn.closest(".work-container");

    if(container.querySelectorAll(".group").length > 1){
        btn.closest(".group").remove();
        reIndex(type);
    }
}

// ===== ADD SUB =====
function addSub(btn){
    const work = btn.closest(".group");
    const container = work.querySelector(".sub-container");
    const type = work.closest(".box").id.replace("-container","");

    const sub = container.querySelector(".group").cloneNode(true);

    sub.querySelector("select").value = "";
    sub.querySelector("select").innerHTML = '<option value="">Sub</option>';

    container.appendChild(sub);
    reIndex(type);
}

// ===== REMOVE SUB =====
function removeSub(btn){
    const work = btn.closest(".group");
    const type = work.closest(".box").id.replace("-container","");
    const container = btn.closest(".sub-container");

    if(container.querySelectorAll(".group").length > 1){
        btn.closest(".group").remove();
        reIndex(type);
    }
}

// ===== CHANGE =====
document.addEventListener("change", function(e){

    if(e.target.classList.contains("main")){
        const row = e.target.closest(".row");
        const works = row.querySelectorAll(".work");

        works.forEach(w=>{
            w.innerHTML = `<option value="">Work</option>`;
            if(data[e.target.value]){
                Object.keys(data[e.target.value]).forEach(k=>{
                    w.innerHTML += `<option value="${k}">${k}</option>`;
                });
            }
        });
    }

    if(e.target.classList.contains("work")){
        const workDiv = e.target.closest(".group");
        const row = workDiv.closest(".row");

        const main = row.querySelector(".main").value;
        const subs = workDiv.querySelectorAll("select[name*='sub']");

        subs.forEach(s=>{
            s.innerHTML = `<option value="">Sub</option>`;
            if(data[main] && data[main][e.target.value]){
                data[main][e.target.value].forEach(x=>{
                    s.innerHTML += `<option value="${x}">${x}</option>`;
                });
            }
        });
    }

});
</script>
