<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Dynamic Report Edit</title>

<style>

body{
    font-family: Arial;
    padding:20px;
}

.type{
    border:2px solid #333;
    padding:15px;
    margin-bottom:20px;
}

.project{
    border:1px solid #999;
    padding:10px;
    margin-top:10px;
}

.task{
    border:1px dashed #666;
    padding:10px;
    margin-top:10px;
}

.work{
    border:1px solid #ccc;
    padding:10px;
    margin-top:10px;
}

.row{
    margin-top:10px;
}

select,
input{
    padding:5px;
    margin-right:5px;
}

button{
    padding:5px 10px;
    cursor:pointer;
}

pre{
    background:#eee;
    padding:10px;
    margin-top:20px;
}

</style>
</head>
<body>

<div id="app"></div>

<button id="show-json">
    GET JSON
</button>

<pre id="result"></pre>

<script>

// =====================================
// MASTER DATA
// =====================================

const projectData = [

    {id:1,name:"Project A"},
    {id:2,name:"Project B"}

];

const taskData = {

    1:[
        {id:11,name:"API"},
        {id:12,name:"UI"}
    ],

    2:[
        {id:21,name:"Database"},
        {id:22,name:"Report"}
    ]

};

const workData = [

    {id:'dev',name:"Dev"},
    {id:'test',name:"Test"},
    {id:'review',name:"Review"},
    {id:'checklist',name:"Checklist"},
    {id:'investigation',name:"Investigation"}

];


// =====================================
// EDIT DATA
// =====================================

const editData = [

    {

        type: "done",

        projects: [

            {

                id: 100,
                project_id: 1,

                tasks: [

                    {

                        id: 200,
                        task_id: 11,
                        percent: 80,
                        time: "2h",

                        works: [

                            {
                                id: 300,
                                work_id: "dev",
                                status: "done api"
                            },

                            {
                                id: 301,
                                work_id: "review",
                                status: "review api"
                            }

                        ]

                    }

                ]

            }

        ]

    }

];


// =====================================
// TYPES
// =====================================

const types = [
    "done",
    "issue",
    "plan",
    "debts"
];


// =====================================
// CREATE TYPE
// =====================================

function createType(type){

    return `
    
        <div class="type"
             data-type="${type}">

            <h2>
                ${type.toUpperCase()}
            </h2>

            <div class="projects"></div>

        </div>
    
    `;
}


// =====================================
// CREATE PROJECT
// =====================================

function createProject(
    recordId = "",
    projectId = ""
){

    return `
    
        <div class="project"
             data-id="${recordId}"
             data-project-id="${projectId}">

            <div class="row">

                <select class="project-select">

                    <option value="">
                        Choose Project
                    </option>

                    ${projectData.map(project=>`
                    
                        <option
                            value="${project.id}"
                            ${project.id == projectId ? "selected" : ""}
                        >
                            ${project.name}
                        </option>
                    
                    `).join("")}

                </select>

                <button class="add-project">
                    + Project
                </button>

                <button class="remove-project">
                    - Project
                </button>

            </div>

            <div class="tasks"></div>

        </div>
    
    `;
}


// =====================================
// CREATE TASK
// =====================================

function createTask(
    projectId = "",
    recordId = "",
    taskId = "",
    percent = "",
    time = ""
){

    return `
    
        <div class="task"
             data-id="${recordId}"
             data-task-id="${taskId}">

            <div class="row">

                <select class="task-select">

                    <option value="">
                        Choose Task
                    </option>

                    ${
                        taskData[projectId]
                        ? taskData[projectId].map(task=>`
                        
                            <option
                                value="${task.id}"
                                ${task.id == taskId ? "selected" : ""}
                            >
                                ${task.name}
                            </option>
                        
                        `).join("")
                        : ""
                    }

                </select>

                <input type="number"
                       class="percent"
                       placeholder="%"
                       value="${percent}">

                <input type="text"
                       class="time"
                       placeholder="Time"
                       value="${time}">

                <button class="add-task">
                    + Task
                </button>

                <button class="remove-task">
                    - Task
                </button>

            </div>

            <div class="works"></div>

        </div>
    
    `;
}


// =====================================
// CREATE WORK
// =====================================

function createWork(
    recordId = "",
    workId = "",
    status = ""
){

    return `
    
        <div class="work"
             data-id="${recordId}"
             data-work-id="${workId}">

            <div class="row">

                <select class="work-select">

                    <option value="">
                        Choose Work
                    </option>

                    ${workData.map(work=>`
                    
                        <option
                            value="${work.id}"
                            ${work.id == workId ? "selected" : ""}
                        >
                            ${work.name}
                        </option>
                    
                    `).join("")}

                </select>

                <input type="text"
                       class="status"
                       placeholder="Status"
                       value="${status}">

                <button class="add-work">
                    + Work
                </button>

                <button class="remove-work">
                    - Work
                </button>

            </div>

        </div>
    
    `;
}


// =====================================
// LOAD TASK OPTIONS
// =====================================

function loadTaskOptions(project){

    const projectId =
        project.dataset.projectId;

    project.querySelectorAll(".task-select")
    .forEach(select=>{

        const selected =
            select.value;

        select.innerHTML = `
        
            <option value="">
                Choose Task
            </option>
        
        `;

        if(taskData[projectId]){

            taskData[projectId]
            .forEach(task=>{

                select.innerHTML += `
                
                    <option
                        value="${task.id}"
                        ${task.id == selected ? "selected" : ""}
                    >
                        ${task.name}
                    </option>
                
                `;
            });

        }

    });

}


// =====================================
// RENDER TYPES
// =====================================

const app =
    document.getElementById("app");

types.forEach(type=>{

    app.innerHTML += createType(type);

});


// =====================================
// RENDER EDIT DATA
// =====================================

function renderEditData(data){

    data.forEach(typeData=>{

        const typeEl =
            document.querySelector(
                `[data-type="${typeData.type}"]`
            );

        const projectsEl =
            typeEl.querySelector(".projects");

        projectsEl.innerHTML = "";

        typeData.projects.forEach(project=>{

            // =====================
            // PROJECT
            // =====================

            projectsEl.insertAdjacentHTML(
                "beforeend",
                createProject(
                    project.id,
                    project.project_id
                )
            );

            const projectEl =
                projectsEl.lastElementChild;

            const tasksEl =
                projectEl.querySelector(".tasks");

            // =====================
            // TASKS
            // =====================

            project.tasks.forEach(task=>{

                tasksEl.insertAdjacentHTML(
                    "beforeend",
                    createTask(
                        project.project_id,
                        task.id,
                        task.task_id,
                        task.percent,
                        task.time
                    )
                );

                const taskEl =
                    tasksEl.lastElementChild;

                const worksEl =
                    taskEl.querySelector(".works");

                // =====================
                // WORKS
                // =====================

                task.works.forEach(work=>{

                    worksEl.insertAdjacentHTML(
                        "beforeend",
                        createWork(
                            work.id,
                            work.work_id,
                            work.status
                        )
                    );

                });

            });

        });

    });

}

renderEditData(editData);


// =====================================
// CHANGE
// =====================================

document.addEventListener("change",function(e){

    // =============================
    // PROJECT
    // =============================

    if(e.target.classList.contains("project-select")){

        const project =
            e.target.closest(".project");

        project.dataset.projectId =
            e.target.value;

        project.querySelectorAll(".task")
        .forEach(task=>{

            task.dataset.taskId = "";

            task.querySelector(".task-select").value = "";

        });

        loadTaskOptions(project);
    }


    // =============================
    // TASK
    // =============================

    if(e.target.classList.contains("task-select")){

        const task =
            e.target.closest(".task");

        task.dataset.taskId =
            e.target.value;
    }


    // =============================
    // WORK
    // =============================

    if(e.target.classList.contains("work-select")){

        const work =
            e.target.closest(".work");

        work.dataset.workId =
            e.target.value;
    }

});


// =====================================
// CLICK
// =====================================

document.addEventListener("click",function(e){

    // =============================
    // ADD PROJECT
    // =============================

    if(e.target.classList.contains("add-project")){

        const type =
            e.target.closest(".type");

        type.querySelector(".projects")
        .insertAdjacentHTML(
            "beforeend",
            createProject()
        );
    }


    // =============================
    // REMOVE PROJECT
    // =============================

    if(e.target.classList.contains("remove-project")){

        const type =
            e.target.closest(".type");

        const projects =
            type.querySelectorAll(".project");

        if(projects.length > 1){

            e.target.closest(".project").remove();
        }
    }


    // =============================
    // ADD TASK
    // =============================

    if(e.target.classList.contains("add-task")){

        const project =
            e.target.closest(".project");

        const projectId =
            project.dataset.projectId;

        project.querySelector(".tasks")
        .insertAdjacentHTML(
            "beforeend",
            createTask(projectId)
        );
    }


    // =============================
    // REMOVE TASK
    // =============================

    if(e.target.classList.contains("remove-task")){

        const project =
            e.target.closest(".project");

        const tasks =
            project.querySelectorAll(".task");

        if(tasks.length > 1){

            e.target.closest(".task").remove();
        }
    }


    // =============================
    // ADD WORK
    // =============================

    if(e.target.classList.contains("add-work")){

        const task =
            e.target.closest(".task");

        task.querySelector(".works")
        .insertAdjacentHTML(
            "beforeend",
            createWork()
        );
    }


    // =============================
    // REMOVE WORK
    // =============================

    if(e.target.classList.contains("remove-work")){

        const task =
            e.target.closest(".task");

        const works =
            task.querySelectorAll(".work");

        if(works.length > 1){

            e.target.closest(".work").remove();
        }
    }

});


// =====================================
// GET JSON
// =====================================

function getData(){

    return Array.from(
        document.querySelectorAll(".type")
    ).map(type=>{

        return {

            type:
                type.dataset.type,

            projects: Array.from(
                type.querySelectorAll(
                    ":scope > .projects > .project"
                )
            ).map(project=>{

                return {

                    id:
                        project.dataset.id,

                    project_id:
                        project.dataset.projectId,

                    tasks: Array.from(
                        project.querySelectorAll(
                            ":scope > .tasks > .task"
                        )
                    ).map(task=>{

                        return {

                            id:
                                task.dataset.id,

                            task_id:
                                task.dataset.taskId,

                            percent:
                                task.querySelector(".percent").value,

                            time:
                                task.querySelector(".time").value,

                            works: Array.from(
                                task.querySelectorAll(
                                    ":scope > .works > .work"
                                )
                            ).map(work=>{

                                return {

                                    id:
                                        work.dataset.id,

                                    work_id:
                                        work.dataset.workId,

                                    status:
                                        work.querySelector(".status").value

                                };

                            })

                        };

                    })

                };

            })

        };

    });

}


// =====================================
// SHOW JSON
// =====================================

document.getElementById("show-json")
.addEventListener("click",function(){

    const data = getData();

    console.log(data);

    document.getElementById("result")
    .textContent =
        JSON.stringify(data,null,2);

});

</script>

</body>
</html>
