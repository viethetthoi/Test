<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Dynamic Report</title>

<style>

body{
    font-family: Arial;
    padding:20px;
}

.type{
    border:2px solid #333;
    padding:15px;
    margin-bottom:20px;
}

.project{
    border:1px solid #999;
    padding:10px;
    margin-top:10px;
}

.task{
    border:1px dashed #666;
    padding:10px;
    margin-top:10px;
}

.work{
    border:1px solid #ccc;
    padding:10px;
    margin-top:10px;
}

.row{
    margin-top:10px;
}

select,
input{
    padding:5px;
    margin-right:5px;
}

button{
    padding:5px 10px;
    cursor:pointer;
}

pre{
    background:#eee;
    padding:10px;
    margin-top:20px;
}

</style>
</head>
<body>

<div id="app"></div>

<button id="show-json">
    GET JSON
</button>

<pre id="result"></pre>

<script>

// =====================================
// DATA
// =====================================

const projectData = [
    {id:1,name:"Project A"},
    {id:2,name:"Project B"}
];

const taskData = {

    1:[
        {id:11,name:"API"},
        {id:12,name:"UI"}
    ],

    2:[
        {id:21,name:"Database"},
        {id:22,name:"Report"}
    ]

};

const workData = [

    {id:'dev',name:"Dev"},
    {id:'test',name:"Test"},
    {id:'review',name:"Review"},
    {id:'checklist',name:"Checklist"},
    {id:'investigation',name:"Investigation"}

];

const types = [
    "done",
    "issue",
    "plan",
    "debts"
];


// =====================================
// CREATE TYPE
// =====================================

function createType(type){

    return `
    
        <div class="type"
             data-type="${type}">

            <h2>
                ${type.toUpperCase()}
            </h2>

            <div class="projects">

                ${createProject()}

            </div>

        </div>
    
    `;
}


// =====================================
// CREATE PROJECT
// =====================================

function createProject(){

    return `
    
        <div class="project"
             data-project-id="">

            <!-- PROJECT -->

            <div class="row">

                <select class="project-select">

                    <option value="">
                        Choose Project
                    </option>

                    ${projectData.map(project=>`
                    
                        <option value="${project.id}">
                            ${project.name}
                        </option>
                    
                    `).join("")}

                </select>

                <button class="add-project">
                    + Project
                </button>

                <button class="remove-project">
                    - Project
                </button>

            </div>

            <!-- TASKS -->

            <div class="tasks">

                ${createTask()}

            </div>

        </div>
    
    `;
}


// =====================================
// CREATE TASK
// =====================================

function createTask(){

    return `
    
        <div class="task"
             data-task-id="">

            <div class="row">

                <select class="task-select">

                    <option value="">
                        Choose Task
                    </option>

                </select>

                <input type="number"
                       class="percent"
                       placeholder="%"
                       min="0"
                       max="100">

                <input type="text"
                       class="time"
                       placeholder="Time">

                <button class="add-task">
                    + Task
                </button>

                <button class="remove-task">
                    - Task
                </button>

            </div>

            <!-- WORKS -->

            <div class="works">

                ${createWork()}

            </div>

        </div>
    
    `;
}


// =====================================
// CREATE WORK
// =====================================

function createWork(){

    return `
    
        <div class="work"
             data-work-id="">

            <div class="row">

                <select class="work-select">

                    <option value="">
                        Choose Work
                    </option>

                    ${workData.map(work=>`
                    
                        <option value="${work.id}">
                            ${work.name}
                        </option>
                    
                    `).join("")}

                </select>

                <input type="text"
                       class="status"
                       placeholder="Status">

                <button class="add-work">
                    + Work
                </button>

                <button class="remove-work">
                    - Work
                </button>

            </div>

        </div>
    
    `;
}


// =====================================
// RESET
// =====================================

function resetProject(project){

    project.dataset.projectId = "";
}

function resetTask(task){

    task.dataset.taskId = "";
}

function resetWork(work){

    work.dataset.workId = "";
}


// =====================================
// LOAD TASK OPTIONS
// =====================================

function loadTaskOptions(project){

    const projectId =
        project.dataset.projectId;

    project.querySelectorAll(".task-select")
    .forEach(select=>{

        select.innerHTML = `
        
            <option value="">
                Choose Task
            </option>
        
        `;

        if(taskData[projectId]){

            taskData[projectId]
            .forEach(task=>{

                select.innerHTML += `
                
                    <option value="${task.id}">
                        ${task.name}
                    </option>
                
                `;
            });

        }

    });

}


// =====================================
// RENDER
// =====================================

const app =
    document.getElementById("app");

types.forEach(type=>{

    app.innerHTML += createType(type);

});


// =====================================
// CHANGE
// =====================================

document.addEventListener("change",function(e){

    // =============================
    // PROJECT
    // =============================

    if(e.target.classList.contains("project-select")){

        const project =
            e.target.closest(".project");

        project.dataset.projectId =
            e.target.value;

        project.querySelectorAll(".task")
        .forEach(task=>{

            resetTask(task);

            task.querySelectorAll(".work")
            .forEach(work=>{

                resetWork(work);

            });

        });

        loadTaskOptions(project);
    }


    // =============================
    // TASK
    // =============================

    if(e.target.classList.contains("task-select")){

        const task =
            e.target.closest(".task");

        task.dataset.taskId =
            e.target.value;
    }


    // =============================
    // WORK
    // =============================

    if(e.target.classList.contains("work-select")){

        const work =
            e.target.closest(".work");

        work.dataset.workId =
            e.target.value;
    }

});


// =====================================
// CLICK
// =====================================

document.addEventListener("click",function(e){

    // =============================
    // ADD PROJECT
    // =============================

    if(e.target.classList.contains("add-project")){

        const type =
            e.target.closest(".type");

        type.querySelector(".projects")
        .insertAdjacentHTML(
            "beforeend",
            createProject()
        );
    }


    // =============================
    // REMOVE PROJECT
    // =============================

    if(e.target.classList.contains("remove-project")){

        const type =
            e.target.closest(".type");

        const projects =
            type.querySelectorAll(".project");

        if(projects.length > 1){

            e.target.closest(".project").remove();
        }
    }


    // =============================
    // ADD TASK
    // =============================

    if(e.target.classList.contains("add-task")){

        const project =
            e.target.closest(".project");

        project.querySelector(".tasks")
        .insertAdjacentHTML(
            "beforeend",
            createTask()
        );

        loadTaskOptions(project);
    }


    // =============================
    // REMOVE TASK
    // =============================

    if(e.target.classList.contains("remove-task")){

        const project =
            e.target.closest(".project");

        const tasks =
            project.querySelectorAll(".task");

        if(tasks.length > 1){

            e.target.closest(".task").remove();
        }
    }


    // =============================
    // ADD WORK
    // =============================

    if(e.target.classList.contains("add-work")){

        const task =
            e.target.closest(".task");

        task.querySelector(".works")
        .insertAdjacentHTML(
            "beforeend",
            createWork()
        );
    }


    // =============================
    // REMOVE WORK
    // =============================

    if(e.target.classList.contains("remove-work")){

        const task =
            e.target.closest(".task");

        const works =
            task.querySelectorAll(".work");

        if(works.length > 1){

            e.target.closest(".work").remove();
        }
    }

});


// =====================================
// GET JSON
// =====================================

function getData(){

    return Array.from(
        document.querySelectorAll(".type")
    ).map(type=>{

        return {

            type:
                type.dataset.type,

            projects: Array.from(
                type.querySelectorAll(
                    ":scope > .projects > .project"
                )
            ).map(project=>{

                return {

                    project_id:
                        project.dataset.projectId,

                    tasks: Array.from(
                        project.querySelectorAll(
                            ":scope > .tasks > .task"
                        )
                    ).map(task=>{

                        return {

                            task_id:
                                task.dataset.taskId,

                            percent:
                                task.querySelector(".percent").value,

                            time:
                                task.querySelector(".time").value,

                            works: Array.from(
                                task.querySelectorAll(
                                    ":scope > .works > .work"
                                )
                            ).map(work=>{

                                return {

                                    work_id:
                                        work.dataset.workId,

                                    status:
                                        work.querySelector(".status").value

                                };

                            })

                        };

                    })

                };

            })

        };

    });

}


// =====================================
// SHOW JSON
// =====================================

document.getElementById("show-json")
.addEventListener("click",function(){

    const data = getData();

    console.log(data);

    document.getElementById("result")
    .textContent =
        JSON.stringify(data,null,2);

});

</script>

</body>
</html>
