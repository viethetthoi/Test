<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Dynamic Report</title>

<style>

body{
    font-family: Arial;
    padding:20px;
}

.type{
    border:2px solid #333;
    padding:15px;
    margin-bottom:20px;
}

.project{
    border:1px solid #999;
    padding:10px;
    margin-top:10px;
}

.task{
    border:1px dashed #666;
    padding:10px;
    margin-top:10px;
}

.work{
    border:1px solid #ccc;
    padding:10px;
    margin-top:10px;
}

button{
    margin:5px;
    cursor:pointer;
}

select,input{
    padding:5px;
    margin:5px;
}

pre{
    background:#eee;
    padding:10px;
    margin-top:20px;
}

</style>
</head>
<body>

<div id="app"></div>

<button id="get-json">
    GET JSON
</button>

<pre id="result"></pre>

<script>

// ==========================
// FAKE DATA
// ==========================

const projects = [
    {id:1,name:"Project A"},
    {id:2,name:"Project B"}
];

const tasks = {
    1:[
        {id:11,name:"API"},
        {id:12,name:"UI"}
    ],
    2:[
        {id:21,name:"Database"},
        {id:22,name:"Report"}
    ]
};

const works = {
    11:[
        {id:111,name:"Create API"},
        {id:112,name:"Fix API"}
    ],
    12:[
        {id:121,name:"Create UI"}
    ],
    21:[
        {id:211,name:"Optimize DB"}
    ],
    22:[
        {id:221,name:"Export Excel"}
    ]
};


// ==========================
// TYPES
// ==========================

const types = [
    "done",
    "issue",
    "plan",
    "debts"
];


// ==========================
// RENDER TYPES
// ==========================

const app = document.getElementById("app");

types.forEach(type=>{

    app.innerHTML += `
    
        <div class="type"
             data-type="${type}">
             
            <h2>
                ${type.toUpperCase()}
            </h2>

            <button class="add-project">
                + Project
            </button>

            <div class="projects"></div>

        </div>
    
    `;
});


// ==========================
// PROJECT HTML
// ==========================

function projectTemplate(){

    return `
    
        <div class="project"
             data-project-id="">

            <select class="project-select">

                <option value="">
                    Choose Project
                </option>

                ${projects.map(project=>`
                
                    <option value="${project.id}">
                        ${project.name}
                    </option>
                
                `).join("")}

            </select>

            <button class="add-task">
                + Task
            </button>

            <button class="remove-project">
                - Project
            </button>

            <div class="tasks"></div>

        </div>
    
    `;
}


// ==========================
// TASK HTML
// ==========================

function taskTemplate(){

    return `
    
        <div class="task"
             data-task-id="">

            <select class="task-select">

                <option value="">
                    Choose Task
                </option>

            </select>

            <button class="add-work">
                + Work
            </button>

            <button class="remove-task">
                - Task
            </button>

            <div class="works"></div>

        </div>
    
    `;
}


// ==========================
// WORK HTML
// ==========================

function workTemplate(){

    return `
    
        <div class="work"
             data-work-id="">

            <select class="work-select">

                <option value="">
                    Choose Work
                </option>

            </select>

            <input type="text"
                   class="status"
                   placeholder="Status">

            <button class="remove-work">
                - Work
            </button>

        </div>
    
    `;
}


// ==========================
// CHANGE
// ==========================

document.addEventListener("change",function(e){

    // ======================
    // PROJECT CHANGE
    // ======================

    if(e.target.classList.contains("project-select")){

        const project =
            e.target.closest(".project");

        const projectId =
            e.target.value;

        project.dataset.projectId =
            projectId;

        // reset task
        project.querySelectorAll(".task")
        .forEach(task=>{

            task.dataset.taskId = "";

            task.querySelector(".task-select")
            .innerHTML = `
                <option value="">
                    Choose Task
                </option>
            `;

            task.querySelectorAll(".work")
            .forEach(work=>{

                work.dataset.workId = "";

                work.querySelector(".work-select")
                .innerHTML = `
                    <option value="">
                        Choose Work
                    </option>
                `;
            });

        });

        // load task options
        project.querySelectorAll(".task-select")
        .forEach(select=>{

            select.innerHTML = `
                <option value="">
                    Choose Task
                </option>
            `;

            if(tasks[projectId]){

                tasks[projectId]
                .forEach(task=>{

                    select.innerHTML += `
                    
                        <option value="${task.id}">
                            ${task.name}
                        </option>
                    
                    `;
                });
            }

        });

    }


    // ======================
    // TASK CHANGE
    // ======================

    if(e.target.classList.contains("task-select")){

        const task =
            e.target.closest(".task");

        const taskId =
            e.target.value;

        task.dataset.taskId =
            taskId;

        // reset work
        task.querySelectorAll(".work")
        .forEach(work=>{

            work.dataset.workId = "";

            work.querySelector(".work-select")
            .innerHTML = `
                <option value="">
                    Choose Work
                </option>
            `;

        });

        // load work
        task.querySelectorAll(".work-select")
        .forEach(select=>{

            select.innerHTML = `
                <option value="">
                    Choose Work
                </option>
            `;

            if(works[taskId]){

                works[taskId]
                .forEach(work=>{

                    select.innerHTML += `
                    
                        <option value="${work.id}">
                            ${work.name}
                        </option>
                    
                    `;
                });
            }

        });

    }


    // ======================
    // WORK CHANGE
    // ======================

    if(e.target.classList.contains("work-select")){

        const work =
            e.target.closest(".work");

        work.dataset.workId =
            e.target.value;
    }

});


// ==========================
// CLICK
// ==========================

document.addEventListener("click",function(e){

    // ======================
    // ADD PROJECT
    // ======================

    if(e.target.classList.contains("add-project")){

        const type =
            e.target.closest(".type");

        type.querySelector(".projects")
        .insertAdjacentHTML(
            "beforeend",
            projectTemplate()
        );
    }


    // ======================
    // ADD TASK
    // ======================

    if(e.target.classList.contains("add-task")){

        const project =
            e.target.closest(".project");

        project.querySelector(".tasks")
        .insertAdjacentHTML(
            "beforeend",
            taskTemplate()
        );

        const taskSelect =
            project.querySelector(
                ".tasks .task:last-child .task-select"
            );

        const projectId =
            project.dataset.projectId;

        if(tasks[projectId]){

            tasks[projectId]
            .forEach(task=>{

                taskSelect.innerHTML += `
                
                    <option value="${task.id}">
                        ${task.name}
                    </option>
                
                `;
            });
        }

    }


    // ======================
    // ADD WORK
    // ======================

    if(e.target.classList.contains("add-work")){

        const task =
            e.target.closest(".task");

        task.querySelector(".works")
        .insertAdjacentHTML(
            "beforeend",
            workTemplate()
        );

        const workSelect =
            task.querySelector(
                ".works .work:last-child .work-select"
            );

        const taskId =
            task.dataset.taskId;

        if(works[taskId]){

            works[taskId]
            .forEach(work=>{

                workSelect.innerHTML += `
                
                    <option value="${work.id}">
                        ${work.name}
                    </option>
                
                `;
            });
        }

    }


    // ======================
    // REMOVE PROJECT
    // ======================

    if(e.target.classList.contains("remove-project")){

        e.target.closest(".project").remove();
    }


    // ======================
    // REMOVE TASK
    // ======================

    if(e.target.classList.contains("remove-task")){

        e.target.closest(".task").remove();
    }


    // ======================
    // REMOVE WORK
    // ======================

    if(e.target.classList.contains("remove-work")){

        e.target.closest(".work").remove();
    }

});


// ==========================
// GET JSON
// ==========================

function getData(){

    return Array.from(
        document.querySelectorAll(".type")
    ).map(type=>{

        return {

            type:
                type.dataset.type,

            projects: Array.from(
                type.querySelectorAll(
                    ":scope > .projects > .project"
                )
            ).map(project=>{

                return {

                    project_id:
                        project.dataset.projectId,

                    tasks: Array.from(
                        project.querySelectorAll(
                            ":scope > .tasks > .task"
                        )
                    ).map(task=>{

                        return {

                            task_id:
                                task.dataset.taskId,

                            works: Array.from(
                                task.querySelectorAll(
                                    ":scope > .works > .work"
                                )
                            ).map(work=>{

                                return {

                                    work_id:
                                        work.dataset.workId,

                                    status:
                                        work.querySelector(".status").value

                                };

                            })

                        };

                    })

                };

            })

        };

    });

}


// ==========================
// SHOW JSON
// ==========================

document.getElementById("get-json")
.addEventListener("click",function(){

    const data = getData();

    console.log(data);

    document.getElementById("result")
    .textContent =
        JSON.stringify(data,null,2);

});

</script>

</body>
</html>
